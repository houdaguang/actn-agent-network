name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a credential is present anywhere in the tree
        run: |
          set -euo pipefail
          # Patterns that must never appear in this repository.
          PATTERNS='github_pat_[A-Za-z0-9_]{20,}'
          PATTERNS="$PATTERNS"'|gh[pousr]_[A-Za-z0-9]{30,}'
          PATTERNS="$PATTERNS"'|sk-[A-Za-z0-9]{20,}'
          PATTERNS="$PATTERNS"'|sk-ant-[A-Za-z0-9_-]{20,}'
          PATTERNS="$PATTERNS"'|AKIA[0-9A-Z]{16}'
          PATTERNS="$PATTERNS"'|AIza[0-9A-Za-z_-]{35}'
          PATTERNS="$PATTERNS"'|xox[baprs]-[A-Za-z0-9-]{10,}'
          PATTERNS="$PATTERNS"'|-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
          PATTERNS="$PATTERNS"'|sk_(live|test)_[A-Za-z0-9]{16,}'
          PATTERNS="$PATTERNS"'|0x[a-fA-F0-9]{64}'

          if grep -rInE "$PATTERNS" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::A credential-shaped string was found in the tree. Remove it and rotate the secret."
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Fail if .env was committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Only .env.example belongs in the repository."
            exit 1
          fi
          echo "No .env file tracked."

  skill-frontmatter:
    name: Validate Agent Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the official Agent Skills validator
        run: pip install "skills-ref"

      - name: Validate with the official validator
        run: |
          set -euo pipefail
          # skills-ref is the reference validator published by the Agent Skills
          # project (agentskills/agentskills). It is authoritative for frontmatter
          # validity, name/directory matching, and field allow-lists.
          skills-ref validate skills/actn-network

      - name: Assert the repository layout the registry importer expects
        run: |
          set -euo pipefail
          test -f skills/actn-network/SKILL.md || { echo "::error::skills/actn-network/SKILL.md is missing."; exit 1; }
          # Bundle the files the skill promises, so an install is never partial.
          for f in references/API.md scripts/check-connection.mjs scripts/check_connection.py; do
            test -f "skills/actn-network/$f" || { echo "::error::skills/actn-network/$f is missing."; exit 1; }
          done
          echo "Skill directory is complete."

  openapi:
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the OpenAPI document
        run: npx --yes @redocly/cli@1 lint openapi/actn-public-api.yaml

  examples-parse:
    name: Examples parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check the Node example
        run: node --check examples/node-polling-agent/index.mjs

      - name: Syntax-check the Node connection checker
        run: node --check skills/actn-network/scripts/check-connection.mjs

      - name: Syntax-check the Python example
        run: python -m py_compile examples/python-polling-agent/agent.py

      - name: Syntax-check the Python connection checker
        run: python -m py_compile skills/actn-network/scripts/check_connection.py

  no-hardcoded-credentials:
    name: Examples take credentials from the environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no example assigns a literal credential
        run: |
          set -euo pipefail
          # The examples must read credentials from the environment, never inline them.
          if grep -rInE "(ACTN_API_KEY|api_key|X-Agent-API-Key)\s*[:=]\s*['\"][A-Za-z0-9_-]{16,}['\"]" \
               examples skills --include='*.mjs' --include='*.js' --include='*.py'; then
            echo "::error::An example appears to hardcode a credential."
            exit 1
          fi
          echo "Examples read credentials from the environment."
